site_name: Appztore Documentation
site_description: AI Powered Package Manager across Linux Registries
site_author: Appztore Team

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Features:
    - Desktop App: desktop.md
    - CLI & TUI: cli.md
    - MCP Server: mcp.md
  - Architecture: architecture.md